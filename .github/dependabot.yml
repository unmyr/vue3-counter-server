version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    # Look for `package.json` and `lock` files in the `root` directory
    directory: "/"
    # Check the npm registry for updates every day (weekdays)
    schedule:
      interval: "weekly"

    groups:
      eslint-tooling:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@typescript-eslint/*"
          - "@vue/eslint-config-*"
          - "prettier"

      jest-tooling:
        patterns:
          - "@types/jest"
          - "@vue/vue3-jest"
          - "babel-jest"
          - "jest"
          - "ts-jest"
        update-types:
          - "patch"

      patch-updates:
        patterns:
          - "*"
        exclude-patterns:
          - "eslint"
          - "eslint-*"
          - "@typescript-eslint/*"
          - "@vue/eslint-config-*"
          - "prettier"
          - "@types/jest"
          - "@vue/vue3-jest"
          - "babel-jest"
          - "jest"
          - "ts-jest"
        update-types:
          - "patch"

    ignore:
      # Remove when the dependent tooling supports TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
