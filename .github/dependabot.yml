version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    # Look for `package.json` and `lock` files in the `root` directory
    directory: "/"
    # Check the npm registry for updates every day (weekdays)
    schedule:
      interval: "weekly"

    groups:
      eslint-tooling:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@typescript-eslint/*"
          - "@vue/eslint-config-*"
          - "prettier"

      patch-updates:
        patterns:
          - "*"
        exclude-patterns:
          - "eslint"
          - "eslint-*"
          - "@typescript-eslint/*"
          - "@vue/eslint-config-*"
          - "prettier"
        update-types:
          - "patch"

    ignore:
      # Remove when the dependent tooling supports TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # ESLint is prone to compatibility issues, so it will be excluded from automatic updates.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@typescript-eslint/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vue/eslint-config-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "prettier"
        update-types: ["version-update:semver-major"]
